[package]
name = "neosh"
version = "0.1.1"
edition = "2024"
description = "A bash-compatible shell with navi inside"
license = "MIT"
repository = "https://github.com/Jeanno/neosh"
publish = false

[dependencies]
brush-core = "0.5.0"
brush-builtins = "0.2.0"
brush-interactive = { version = "0.4.0", features = ["reedline", "minimal"] }
crossterm = "0.29.0"
libc = "0.2"
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]

[profile.release]
lto = "thin"

# brush-interactive 0.4.0 with small changes for navi lines, navi mode and
# prompts (vendor/brush-interactive/NEOSH.md).
#
# brush-core 0.5.0 from neosh's fork, branch `neosh`: fixes to brush's engine
# that neosh needs, each a commit on top of brush-core-v0.5.0 (README,
# "brush"). brush-parser comes with it, so the two always match.
[patch.crates-io]
brush-interactive = { path = "vendor/brush-interactive" }
brush-core = { git = "https://github.com/Jeanno/brush", branch = "neosh" }
brush-parser = { git = "https://github.com/Jeanno/brush", branch = "neosh" }
