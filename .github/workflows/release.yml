# Builds neosh for each machine install.sh knows and makes a GitHub Release
# of them when a tag v<version> is pushed (NSH-65). The tag must be the
# version in Cargo.toml. Each asset is neosh-<target>.tar.gz, holding the
# program, README.md and LICENSE, with neosh-<target>.tar.gz.sha256 beside it,
# so install.sh finds them under releases/latest/download.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      # A build that fails leaves the others to be released.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag is Cargo.toml's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME is not v$version (Cargo.toml)"; exit 1; }

      - run: rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: neosh-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          asset=neosh-${{ matrix.target }}.tar.gz
          mkdir -p dist
          cp target/${{ matrix.target }}/release/neosh README.md LICENSE dist/
          tar -czf "$asset" -C dist neosh README.md LICENSE
          if command -v shasum >/dev/null; then shasum -a 256 "$asset"; else sha256sum "$asset"; fi > "$asset.sha256"
          cat "$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: neosh-${{ matrix.target }}
          path: neosh-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    # Released with what was built, as long as the Mac on arm, which most use, was.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          test -f dist/neosh-aarch64-apple-darwin.tar.gz || { echo "the macOS arm64 build is missing"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "neosh ${GITHUB_REF_NAME#v}" \
            --generate-notes
